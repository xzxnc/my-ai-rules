name: Sync AI Rules

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-and-filter:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download and filter
        run: |
          curl -sL "https://cdn.jsdelivr.net/gh/szkane/ClashRuleSet@main/Clash/Ruleset/AiDomain.list" -o original.list
          
          # 过滤处理
          grep -v '^#' original.list | grep -v '^$' > step1.list
          grep -vE '(bing\.com|edgesuite\.net|msn\.com|office\.com|live\.com|outlook\.com|microsoft\.com)$' step1.list > step2.list
          grep -vE '\.google\.(com|cn|co\.jp|co\.kr|co\.uk)$' step2.list | grep -vE '^DOMAIN-SUFFIX,(google\.com|google\.cn|gmail\.com|googlevideo\.com|doubleclick\.net|googlesyndication\.com)$' > step3.list
          cat step3.list | grep -iE '(openai|chatgpt|anthropic|claude|recraft|perplexity|deepseek|x\.ai|grok|githubcopilot|lmstudio|lmsudio|gemini|bard|deepmind|aistudio|sora|midjourney|runwayml|characterai|poe|elevenlabs|huggingface|ollama)' > step4.list
          sort -u step4.list > step5.list
          
          {
            echo "# AI Domain Rules - Auto-generated"
            echo "# Updated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            cat step5.list
          } > AiDomain_AI.list
          
          echo "过滤后: $(grep -v '^#' AiDomain_AI.list | grep -v '^$' | wc -l) 行"

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add AiDomain_AI.list
          
          if git diff --staged --quiet; then
            echo "没有变化，跳过"
            exit 0
          fi
          
          git diff --staged --stat
          git commit -m "chore: sync AI rules $(date -u +%Y-%m-%d)"
          git push

      - name: Show result
        run: head -30 AiDomain_AI.list
