name: Sync AI Rules

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-and-filter:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download and filter
        run: |
          curl -sL "https://cdn.jsdelivr.net/gh/szkane/ClashRuleSet@main/Clash/Ruleset/AiDomain.list" -o original.list

          python3 <<'PY'
          from datetime import datetime
          from pathlib import Path

          raw = Path('original.list').read_text(encoding='utf-8').splitlines()

          ordered_lines = [
              '# ========== AI Domain Rules ==========',
              '# Auto-generated from szkane/ClashRuleSet',
              '# Only keep AI-related domains',
              '# Updated: ' + datetime.utcnow().strftime('%Y-%m-%d'),
              '',
              '# OpenAI / ChatGPT',
              'DOMAIN-KEYWORD,openai',
              'DOMAIN-KEYWORD,chatgpt',
              'DOMAIN-SUFFIX,openai.com',
              'DOMAIN-SUFFIX,openaiapi-site.azureedge.net',
              'DOMAIN-SUFFIX,chatgpt.com',
              'DOMAIN-SUFFIX,oaistatic.com',
              'DOMAIN-SUFFIX,oaiusercontent.com',
              'DOMAIN-SUFFIX,sora.com',
              '',
              '# Claude / Anthropic',
              'DOMAIN-KEYWORD,anthropic',
              'DOMAIN-KEYWORD,claude',
              'DOMAIN-SUFFIX,anthropic.com',
              'DOMAIN-SUFFIX,claude.ai',
              'DOMAIN-SUFFIX,claude.com',
              'DOMAIN-SUFFIX,claudeusercontent.com',
              'PROCESS-NAME,Claude',
              'PROCESS-NAME,Claude Helper',
              'PROCESS-NAME,Claude Helper (Renderer)',
              '',
              '# Recraft',
              'DOMAIN-SUFFIX,recraft.ai',
              '',
              '# Poe',
              'DOMAIN-SUFFIX,poe.com',
              '',
              '# LM Studio',
              'PROCESS-NAME,LM Studio',
              'DOMAIN-SUFFIX,lmsudio.ai',
              '',
              '# Grok',
              'PROCESS-NAME,grok',
              'DOMAIN-KEYWORD,grok',
              'DOMAIN-SUFFIX,x.ai',
              'DOMAIN-SUFFIX,grok.com',
              '',
              '# Perplexity',
              'DOMAIN-SUFFIX,perplexity.ai',
              '',
              '# GitHub Copilot',
              'DOMAIN-SUFFIX,githubcopilot.com',
              'DOMAIN-SUFFIX,api.githubcopilot.com',
              'DOMAIN-SUFFIX,api.github.com',
              'PROCESS-NAME,Code Helper',
              'PROCESS-NAME,Code Helper (Plugin)',
              '',
              '# Microsoft Copilot (Bing AI)',
              'DOMAIN-KEYWORD,copilot',
              'DOMAIN-SUFFIX,copilot.microsoft.com',
              'DOMAIN-SUFFIX,edgeservices.bing.com',
              'DOMAIN-SUFFIX,sydney.bing.com',
              '',
              '# Google Gemini / Bard / Deepmind',
              'DOMAIN-KEYWORD,colab',
              'DOMAIN-KEYWORD,generativelanguage',
              'DOMAIN,alkalimakersuite-pa.clients6.google.com',
              'DOMAIN,makersuite.google.com',
              'DOMAIN-SUFFIX,ai.google.dev',
              'DOMAIN-SUFFIX,bard.google.com',
              'DOMAIN-SUFFIX,gemini.google.com',
              'DOMAIN-SUFFIX,aistudio.google.com',
              'DOMAIN-SUFFIX,generativelanguage.googleapis.com',
              'DOMAIN-SUFFIX,deepmind.com',
              'DOMAIN-SUFFIX,generativeai.google',
          ]

          Path('AiDomain_AI.list').write_text('\n'.join(ordered_lines) + '\n', encoding='utf-8')
          print(f'Filtered: {sum(1 for line in ordered_lines if line and not line.startswith("#"))} lines')
          PY

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add AiDomain_AI.list
          
          if git diff --staged --quiet; then
            echo "没有变化，跳过"
            exit 0
          fi
          
          git diff --staged --stat
          git commit -m "chore: sync AI rules $(date -u +%Y-%m-%d)"
          git push

      - name: Show result
        run: head -30 AiDomain_AI.list
